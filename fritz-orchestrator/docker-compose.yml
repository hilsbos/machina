# Development docker-compose - builds images locally
# For production deployment, use docker-compose.prod.yml
#
# Build agent images:
#   docker-compose build                                  # builds daemon only
#   docker-compose --profile build build fritz-agent      # builds default agent image
#   docker-compose --profile build build fritz-agent-java # builds Java agent image
#   docker-compose --profile build build fritz-agent-cpp  # builds C/C++ agent image
#   docker-compose --profile build build fritz-agent-kali # builds Kali Linux agent image

services:
  fritz-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    image: fritz-daemon:latest
    container_name: fritz-daemon
    restart: unless-stopped

    # Mount Docker socket to allow spawning agent containers
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .workspaces:/app/.workspaces
      - ${HOME}/.claude:${HOME}/.claude

    # Environment variables from host (via .env file or system environment)
    # NO SECRETS ARE IN THE IMAGE - only injected at runtime
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - GH_TOKEN=${GH_TOKEN:-}
      - GITHUB_REPO=${GITHUB_REPO:-}
      # Docker-in-Docker: Host path to workspaces for mounting in agent containers
      - HOST_WORKSPACES_DIR=${PWD}/.workspaces
      # Container registry for auto-pulling agent images (default: ghcr.io/your-org)
      - GHCR_REGISTRY=${GHCR_REGISTRY:-}
      # Host path to .claude directory for subscription auth
      - HOST_CLAUDE_HOME=${HOST_CLAUDE_HOME:-${HOME}/.claude}
      # Claude home directory for subscription tokens
      - HOME=${HOME}
      # OpenTelemetry collector endpoint (enables agent telemetry when set)
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}

    # Named network so agent containers can reach the daemon by hostname
    networks:
      - fritz

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Agent images (build only - not run via compose, spawned by daemon)
  # Each language variant uses a separate image name (fritz-agent-java, fritz-agent-cpp)
  # rather than tags (fritz-agent:java) so that tags remain available for version
  # pinning (e.g., fritz-agent-java:1.2). The daemon selects the image at boot time
  # based on GitHub issue labels (fritz.lang:java, fritz.lang:cpp).
  fritz-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: fritz-agent
    profiles: ["build"]

  fritz-agent-java:
    build:
      context: .
      dockerfile: Dockerfile.agent.java
    image: fritz-agent-java
    depends_on: [fritz-agent]
    profiles: ["build"]

  fritz-agent-cpp:
    build:
      context: .
      dockerfile: Dockerfile.agent.cpp
    image: fritz-agent-cpp
    depends_on: [fritz-agent]
    profiles: ["build"]

  fritz-agent-kali:
    build:
      context: .
      dockerfile: Dockerfile.agent.kali
    image: fritz-agent-kali
    profiles: ["build"]
    # Note: NO depends_on fritz-agent — Kali uses its own base image (kalilinux/kali-rolling)

  # fritzbridge — optional bridge to an external agent system
  # Allows fritZ agents/daemon to communicate with an external agent system via HTTP
  fritzbridge:
    image: ghcr.io/your-org/fritzbridge:latest
    container_name: fritzbridge
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # For fritZ orchestrator NDJSON + agent CLI exec
      - ./fritzbridge-data:/app/data                # Audit logs + config persistence
      - /tmp/heartbeat-metrics:/metrics             # Prometheus textfile collector
    environment:
      - PORT=9876
      - FRITZ_DAEMON_URL=${FRITZ_DAEMON_URL:-http://fritz-daemon:3456}
      - EXTERNAL_AGENT_GATEWAY_URL=${EXTERNAL_AGENT_GATEWAY_URL:-ws://external-agent-gateway:18789}
      - EXTERNAL_AGENT_GATEWAY_TOKEN=${EXTERNAL_AGENT_GATEWAY_TOKEN}
      - GH_TOKEN=${GH_TOKEN:-}
      - BRIDGE_API_TOKEN=${BRIDGE_API_TOKEN}
      - FRITZ_FORWARD_AGENT=${FRITZ_FORWARD_AGENT:-main}
    networks:
      - fritz
      - external_agent_default
      - monitoring
    ports:
      - "127.0.0.1:9876:9876"  # Host access for debugging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9876/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  fritz:
    name: fritz
  external_agent_default:
    external: true
  monitoring:
    external: true
    name: fritzmonitor_fritzmonitor
