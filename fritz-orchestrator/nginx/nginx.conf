server {
    listen 443 ssl;
    server_name ${FRITZ_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    ssl_protocols TLSv1.3;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Dashboard SPA
    location /dashboard {
        proxy_pass http://fritz-daemon:3456;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    # Dashboard API + SSE
    location /api/dashboard/ {
        proxy_pass http://fritz-daemon:3456;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    # System Map — live topology visualization (served by fritzmonitor-static)
    location /system-map {
        proxy_pass http://fritzmonitor-static:80/system-map.html;
        proxy_set_header Host $host;
    }

    # Everything else — drop the connection
    location / {
        return 444;
    }
}
