name: Build Agent Images

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  AGENT_IMAGE_NAME: your-org/fritz-agent
  AGENT_JAVA_IMAGE_NAME: your-org/fritz-agent-java
  AGENT_CPP_IMAGE_NAME: your-org/fritz-agent-cpp
  AGENT_KALI_IMAGE_NAME: your-org/fritz-agent-kali
  AGENT_RUST_IMAGE_NAME: your-org/fritz-agent-rust  # informational — matrix job derives names from matrix.variant

jobs:
  build-base-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for agent
        id: meta-agent
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.AGENT_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push agent image
        uses: docker/build-push-action@v5
        with:
          context: ./fritz-orchestrator
          file: ./fritz-orchestrator/Dockerfile.agent
          push: true
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Base Agent Image Built and Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-agent.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  build-variant-agents:
    runs-on: ubuntu-latest
    needs: build-base-agent
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - variant: java
            dockerfile: Dockerfile.agent.java
          - variant: cpp
            dockerfile: Dockerfile.agent.cpp
          - variant: rust
            dockerfile: Dockerfile.agent.rust

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for agent-${{ matrix.variant }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/your-org/fritz-agent-${{ matrix.variant }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push agent-${{ matrix.variant }} image
        uses: docker/build-push-action@v5
        with:
          context: ./fritz-orchestrator
          file: ./fritz-orchestrator/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Resolve FROM fritz-agent to the registry image (Buildx doesn't have it locally)
          build-contexts: |
            fritz-agent=docker-image://${{ env.REGISTRY }}/${{ env.AGENT_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Agent Image (${{ matrix.variant }}) Built and Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  build-kali-agent:
    runs-on: ubuntu-latest
    # No dependency on build-base-agent — Kali uses its own base image (kalilinux/kali-rolling)
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for agent-kali
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.AGENT_KALI_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push agent-kali image
        uses: docker/build-push-action@v5
        with:
          context: ./fritz-orchestrator
          file: ./fritz-orchestrator/Dockerfile.agent.kali
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Agent Image (kali) Built and Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
