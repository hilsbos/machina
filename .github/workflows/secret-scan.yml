name: secret-scan

# Independent public-side drift scan: catches any secret/credential that slips
# into the public repo, on every push/PR and weekly. The private-string denylist
# is NOT used here (it would have to embed the private strings); that gate runs
# pre-push from the maintainer's clone. This job is the credential safety net.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
